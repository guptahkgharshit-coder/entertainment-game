<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K3 Dice Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .game-container { max-width: 500px; margin: 0 auto; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .timer { font-size: 24px; font-weight: 700; color: #FF6B6B; text-align: center; margin: 20px 0; }
        .dice-display { display: flex; justify-content: space-around; margin: 30px 0; }
        .dice { width: 80px; height: 80px; background: white; border: 3px solid #667eea; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .bet-section { margin: 20px 0; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
        .option-btn { padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; background: white; }
        .option-btn:hover { background: #667eea; color: white; }
        .option-btn.selected { background: #667eea; color: white; }
        .bet-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; margin: 10px 0; }
        .place-bet-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .result-section { background: #f0f0f0; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; display: none; }
        .result-section.show { display: block; }
    </style>
</head>
<body>
    <div class="game-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1>🎲 K3 Dice Game</h1>
            <p>Predict 3 Dice Outcomes</p>
        </div>

        <div class="timer" id="timer">180</div>

        <div class="dice-display" id="diceDisplay">
            <div class="dice">?</div>
            <div class="dice">?</div>
            <div class="dice">?</div>
        </div>

        <div class="bet-section">
            <label>Prediction:</label>
            <div class="options-grid">
                <button class="option-btn" onclick="selectOption('triple')">Triple (same)</button>
                <button class="option-btn" onclick="selectOption('pair')">Pair (2 same)</button>
                <button class="option-btn" onclick="selectOption('big')">Big (11-17)</button>
                <button class="option-btn" onclick="selectOption('small')">Small (4-10)</button>
            </div>
            <label>Bet Amount:</label>
            <input type="number" id="betAmount" class="bet-input" placeholder="Enter bet amount" value="10" min="1">
            <div style="background: #f0f0f0; padding: 10px; text-align: center; border-radius: 10px; font-weight: 600;">Selected: <span id="selected">None</span></div>
        </div>

        <button class="place-bet-btn" onclick="placeBet()">Place Bet</button>

        <div class="result-section" id="resultSection">
            <h2 id="resultText">Waiting for result...</h2>
            <p id="resultAmount" style="font-size: 18px; margin: 10px 0;"></p>
            <button class="place-bet-btn" onclick="playAgain()" style="margin-top: 10px;">Play Again</button>
        </div>
    </div>

    <script>
        let selectedOption = null;
        let betPlaced = false;
        let timeLeft = 180;

        function selectOption(option) {
            if (betPlaced) return;
            selectedOption = option;
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('selected').textContent = option.toUpperCase();
        }

        function placeBet() {
            if (!selectedOption) {
                alert('Select a prediction first!');
                return;
            }
            const bet = parseInt(document.getElementById('betAmount').value);
            if (bet < 1) {
                alert('Enter valid bet amount!');
                return;
            }
            
            betPlaced = true;
            startCountdown();
        }

        function startCountdown() {
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    endGame();
                }
            }, 1000);
        }

        function rollDice() {
            return Math.floor(Math.random() * 6) + 1;
        }

        function endGame() {
            const dice1 = rollDice();
            const dice2 = rollDice();
            const dice3 = rollDice();
            const sum = dice1 + dice2 + dice3;

            document.getElementById('diceDisplay').innerHTML = `<div class="dice">${dice1}</div><div class="dice">${dice2}</div><div class="dice">${dice3}</div>`;

            const bet = parseInt(document.getElementById('betAmount').value);
            let won = false;
            let multiplier = 1;

            if (selectedOption === 'triple' && dice1 === dice2 && dice2 === dice3) {
                won = true;
                multiplier = 24;
            } else if (selectedOption === 'pair' && (dice1 === dice2 || dice2 === dice3 || dice1 === dice3)) {
                won = true;
                multiplier = 8;
            } else if (selectedOption === 'big' && sum > 10 && sum <= 17) {
                won = true;
                multiplier = 1.95;
            } else if (selectedOption === 'small' && sum >= 4 && sum <= 10) {
                won = true;
                multiplier = 1.95;
            }

            const winChance = Math.random();
            if (winChance > 0.25) won = false;

            const points = won ? Math.floor(bet * multiplier) : -bet;

            const resultSection = document.getElementById('resultSection');
            document.getElementById('resultText').textContent = won ? '✅ You Won!' : '❌ You Lost!';
            document.getElementById('resultAmount').textContent = `${won ? '+' : ''}${points} Points`;
            document.getElementById('resultAmount').style.color = won ? '#27ae60' : '#e74c3c';
            resultSection.classList.add('show');

            if (window.parent && window.parent.updateWalletFromGame) {
                window.parent.updateWalletFromGame(points);
            }
        }

        function playAgain() {
            location.reload();
        }
    </script>
</body>
</html>
