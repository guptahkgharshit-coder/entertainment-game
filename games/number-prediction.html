<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Prediction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .game-container { max-width: 500px; margin: 0 auto; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .timer { font-size: 24px; font-weight: 700; color: #FF6B6B; text-align: center; margin: 20px 0; }
        .numbers-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
        .number-btn { padding: 15px; border: 3px solid #e0e0e0; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s; background: white; }
        .number-btn:hover { background: #667eea; color: white; border-color: #667eea; }
        .number-btn.selected { background: #667eea; color: white; border-color: #667eea; }
        .bet-section { margin: 20px 0; }
        .bet-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; }
        .bet-type-selector { display: flex; gap: 10px; margin: 10px 0; }
        .bet-type-btn { flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: 0.3s; background: white; }
        .bet-type-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .place-bet-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; }
        .result-section { background: #f0f0f0; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; display: none; }
        .result-section.show { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="game-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1>🔢 Number Prediction</h1>
            <p>Pick a number from 0-9</p>
        </div>

        <div class="timer" id="timer">60</div>

        <div class="numbers-grid">
            <button class="number-btn" onclick="selectNumber(0)">0</button>
            <button class="number-btn" onclick="selectNumber(1)">1</button>
            <button class="number-btn" onclick="selectNumber(2)">2</button>
            <button class="number-btn" onclick="selectNumber(3)">3</button>
            <button class="number-btn" onclick="selectNumber(4)">4</button>
            <button class="number-btn" onclick="selectNumber(5)">5</button>
            <button class="number-btn" onclick="selectNumber(6)">6</button>
            <button class="number-btn" onclick="selectNumber(7)">7</button>
            <button class="number-btn" onclick="selectNumber(8)">8</button>
            <button class="number-btn" onclick="selectNumber(9)">9</button>
        </div>

        <div class="bet-section">
            <label>Bet Type:</label>
            <div class="bet-type-selector">
                <button class="bet-type-btn active" onclick="setBetType('exact')">Exact</button>
                <button class="bet-type-btn" onclick="setBetType('big')">Big</button>
                <button class="bet-type-btn" onclick="setBetType('small')">Small</button>
            </div>
            <label>Bet Amount:</label>
            <input type="number" id="betAmount" class="bet-input" placeholder="Enter bet amount" value="10" min="1">
            <div style="background: #f0f0f0; padding: 10px; text-align: center; margin: 10px 0; border-radius: 10px; font-weight: 600;">Selected: <span id="selected">None</span></div>
        </div>

        <button class="place-bet-btn" onclick="placeBet()">Place Bet</button>

        <div class="result-section" id="resultSection">
            <h2 id="resultText">Waiting for result...</h2>
            <p id="resultAmount" style="font-size: 18px; margin: 10px 0;"></p>
            <button class="place-bet-btn" onclick="playAgain()" style="margin-top: 10px;">Play Again</button>
        </div>
    </div>

    <script>
        let selectedNumber = null;
        let betType = 'exact';
        let betPlaced = false;
        let timeLeft = 60;

        function selectNumber(num) {
            if (betPlaced) return;
            selectedNumber = num;
            document.querySelectorAll('.number-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            document.getElementById('selected').textContent = num;
        }

        function setBetType(type) {
            betType = type;
            document.querySelectorAll('.bet-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function placeBet() {
            if (selectedNumber === null) {
                alert('Select a number first!');
                return;
            }
            const bet = parseInt(document.getElementById('betAmount').value);
            if (bet < 1) {
                alert('Enter valid bet amount!');
                return;
            }
            
            betPlaced = true;
            startCountdown();
        }

        function startCountdown() {
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            const winChance = Math.random();
            let resultNumber = winChance < 0.25 ? selectedNumber : Math.floor(Math.random() * 10);
            
            const bet = parseInt(document.getElementById('betAmount').value);
            let won = false;
            let multiplier = 1;

            if (betType === 'exact') {
                won = resultNumber === selectedNumber;
                multiplier = 9;
            } else if (betType === 'big') {
                won = resultNumber > 5 && resultNumber >= selectedNumber;
                multiplier = 1.9;
            } else if (betType === 'small') {
                won = resultNumber <= 4 && resultNumber <= selectedNumber;
                multiplier = 1.9;
            }

            const points = won ? Math.floor(bet * multiplier) : -bet;

            const resultSection = document.getElementById('resultSection');
            document.getElementById('resultText').textContent = won ? '✅ You Won!' : '❌ You Lost!';
            document.getElementById('resultAmount').textContent = `${won ? '+' : ''}${points} Points`;
            document.getElementById('resultAmount').style.color = won ? '#27ae60' : '#e74c3c';
            resultSection.classList.add('show');

            if (window.parent && window.parent.updateWalletFromGame) {
                window.parent.updateWalletFromGame(points);
            }
        }

        function playAgain() {
            location.reload();
        }
    </script>
</body>
</html>
