<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5D Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .game-container { max-width: 500px; margin: 0 auto; background: white; border-radius: 15px; padding: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .timer { font-size: 24px; font-weight: 700; color: #FF6B6B; text-align: center; margin: 20px 0; }
        .numbers-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
        .number-btn { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; background: white; }
        .number-btn:hover { background: #667eea; color: white; }
        .number-btn.selected { background: #667eea; color: white; }
        .bet-input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; margin: 10px 0; }
        .place-bet-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .result-section { background: #f0f0f0; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; display: none; }
        .result-section.show { display: block; }
    </style>
</head>
<body>
    <div class="game-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1>🎯 5D Game</h1>
            <p>Pick 5 Digit Number</p>
        </div>

        <div class="timer" id="timer">300</div>

        <div class="numbers-grid">
            <button class="number-btn" onclick="selectNumber(0)">0</button>
            <button class="number-btn" onclick="selectNumber(1)">1</button>
            <button class="number-btn" onclick="selectNumber(2)">2</button>
            <button class="number-btn" onclick="selectNumber(3)">3</button>
            <button class="number-btn" onclick="selectNumber(4)">4</button>
            <button class="number-btn" onclick="selectNumber(5)">5</button>
            <button class="number-btn" onclick="selectNumber(6)">6</button>
            <button class="number-btn" onclick="selectNumber(7)">7</button>
            <button class="number-btn" onclick="selectNumber(8)">8</button>
            <button class="number-btn" onclick="selectNumber(9)">9</button>
        </div>

        <div style="background: #f0f0f0; padding: 10px; text-align: center; border-radius: 10px; font-weight: 600; margin: 10px 0;">Selected: <span id="selected">00000</span></div>

        <label>Bet Amount:</label>
        <input type="number" id="betAmount" class="bet-input" placeholder="Enter bet amount" value="10" min="1">

        <button class="place-bet-btn" onclick="placeBet()">Place Bet</button>

        <div class="result-section" id="resultSection">
            <h2 id="resultText">Waiting for result...</h2>
            <p id="resultAmount" style="font-size: 18px; margin: 10px 0;"></p>
            <button class="place-bet-btn" onclick="playAgain()" style="margin-top: 10px;">Play Again</button>
        </div>
    </div>

    <script>
        let selectedNumbers = [0, 0, 0, 0, 0];
        let currentPos = 0;
        let betPlaced = false;
        let timeLeft = 300;

        function selectNumber(num) {
            if (betPlaced || currentPos >= 5) return;
            selectedNumbers[currentPos] = num;
            currentPos++;
            document.getElementById('selected').textContent = selectedNumbers.map(n => n).join('');
        }

        function placeBet() {
            if (currentPos < 5) {
                alert('Enter all 5 digits!');
                return;
            }
            const bet = parseInt(document.getElementById('betAmount').value);
            if (bet < 1) {
                alert('Enter valid bet amount!');
                return;
            }
            
            betPlaced = true;
            startCountdown();
        }

        function startCountdown() {
            const timerEl = document.getElementById('timer');
            const interval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            const bet = parseInt(document.getElementById('betAmount').value);
            const winChance = Math.random();
            const won = winChance < 0.25;
            const multiplier = 99000;
            const points = won ? Math.floor(bet * multiplier) : -bet;

            const resultSection = document.getElementById('resultSection');
            document.getElementById('resultText').textContent = won ? '✅ JACKPOT!' : '❌ Better Luck Next Time!';
            document.getElementById('resultAmount').textContent = `${won ? '+' : ''}${points} Points`;
            document.getElementById('resultAmount').style.color = won ? '#27ae60' : '#e74c3c';
            resultSection.classList.add('show');

            if (window.parent && window.parent.updateWalletFromGame) {
                window.parent.updateWalletFromGame(points);
            }
        }

        function playAgain() {
            location.reload();
        }
    </script>
</body>
</html>
